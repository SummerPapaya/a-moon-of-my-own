<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我有一只月亮 · 挂在遥远天上</title>
<meta name="description" content="时间长河中的月亮——中文诗歌、中文歌曲与世界诗乐，皆沐同一片月光。">
<meta property="og:title" content="我有一只月亮，挂在遥远天上">
<meta property="og:description" content="时间长河中的月亮——溯游千年诗乐，收拢一笺月光。">
<meta property="og:type" content="website">
<meta property="og:image" content="https://moon.summercommences.com/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#07090f">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4f0ea;
  --gold:#d8c9a3;
  --dim:rgba(244,240,234,.55);
  --faint:rgba(244,240,234,.32);
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --kai:"Kaiti SC","KaiTi","STKaiti","Noto Serif SC","Songti SC",serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  background:#07090f;
  color:var(--paper);
  font-family:var(--serif);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
canvas.webgl{position:fixed;inset:0;z-index:0;display:block;touch-action:none;}

/* ---------- 左侧竖排题字 ---------- */
.site-title{
  position:fixed;z-index:6;left:40px;top:52px;
  writing-mode:vertical-rl;pointer-events:none;
  font-family:var(--kai);
  user-select:none;
}
.site-title h1{
  font-size:44px;font-weight:600;letter-spacing:.34em;
  color:rgba(244,240,234,.86);
  text-shadow:0 0 34px rgba(243,233,207,.10);
  font-style:normal;
}
.site-title p{
  margin-right:22px;font-size:15px;letter-spacing:.5em;
  color:rgba(244,240,234,.42);
}

/* ---------- 模式切换 pill ---------- */
.mode-switch{
  position:fixed;z-index:8;top:24px;left:50%;transform:translateX(-50%);
  display:flex;gap:4px;padding:5px;
  background:rgba(18,20,30,.38);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(244,240,234,.13);
  border-radius:999px;
  box-shadow:0 6px 30px rgba(0,0,0,.35);
}
.mode-switch button{
  appearance:none;cursor:pointer;border:none;background:transparent;
  font-family:var(--serif);font-size:14px;letter-spacing:.22em;text-indent:.22em;
  color:var(--dim);padding:8px 20px;border-radius:999px;
  transition:color .5s ease,background .5s ease;
  white-space:nowrap;
}
.mode-switch button.on{
  color:var(--gold);
  background:rgba(216,201,163,.13);
}

/* ---------- 专题 chips ---------- */
.chips{
  position:fixed;z-index:8;top:78px;left:50%;transform:translateX(-50%);
  display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
  max-width:92vw;
  transition:opacity .6s ease;
}
.chips button{
  appearance:none;cursor:pointer;
  background:rgba(255,255,255,.04);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(244,240,234,.11);
  border-radius:999px;
  font-family:var(--serif);font-size:12.5px;letter-spacing:.14em;text-indent:.14em;
  color:rgba(244,240,234,.5);
  padding:6px 16px;
  transition:color .5s ease,border-color .5s ease,background .5s ease;
  white-space:nowrap;
}
.chips button.on{color:var(--gold);border-color:rgba(216,201,163,.4);background:rgba(216,201,163,.08);}
.chips.hidden{opacity:0;pointer-events:none;}

/* ---------- 漂浮条目 ---------- */
.entries{position:fixed;inset:0;z-index:4;pointer-events:none;overflow:hidden;}
.particle-ink{
  position:fixed;inset:0;z-index:3;pointer-events:none;
  opacity:0;transition:opacity .9s ease;
  mix-blend-mode:screen;
}
.particle-ink.on{opacity:.88;}
.entry{
  position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;
  max-width:300px;
  will-change:transform,opacity;
  transition:color .6s ease;
  user-select:none;
}
.entry::before{ /* 极淡暗色衬底，亮星带前仍可读 */
  content:"";position:absolute;inset:-20px -30px;z-index:-1;
  background:radial-gradient(ellipse 60% 56% at 50% 50%, rgba(4,6,12,.40), rgba(4,6,12,0) 72%);
  border-radius:50%;
}
.entry .q{
  font-size:15.5px;line-height:1.9;letter-spacing:.06em;
  color:rgba(244,240,234,.78);
  text-shadow:0 1px 3px rgba(2,4,10,.9), 0 0 16px rgba(2,4,10,.7), 0 1px 12px rgba(0,0,0,.7);
  transition:color .6s ease,text-shadow .6s ease;
}
.entry .m{
  margin-top:7px;font-size:11px;letter-spacing:.12em;
  color:var(--faint);
  font-style:normal;
  transition:color .6s ease;
}
.entry.active .q{color:var(--gold);text-shadow:0 0 22px rgba(216,201,163,.28);}
.entry.active .m{color:rgba(216,201,163,.6);}
.entry:not(.active):hover .q{color:rgba(244,240,234,.95);}
.entry.just-collected .q,.entry.just-collected .qo{animation:collectedPulse 1.4s ease;}
@keyframes collectedPulse{30%{color:var(--gold);text-shadow:0 0 30px rgba(216,201,163,.55);}}

/* 世界版条目：原文（西文 EB Garamond 斜体 / 日文明朝体）+ 中译（绝不斜体）+ 出处 */
.entry .qo{
  font-family:"EB Garamond","Noto Serif SC",serif;font-style:italic;
  font-size:15.5px;line-height:1.75;letter-spacing:.03em;
  color:rgba(244,240,234,.8);
  text-shadow:0 1px 3px rgba(2,4,10,.9), 0 0 16px rgba(2,4,10,.7), 0 1px 12px rgba(0,0,0,.7);
  transition:color .6s ease,text-shadow .6s ease;
}
.entry .qo.jp{
  font-style:normal;letter-spacing:.1em;
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Noto Serif SC",serif;
}
.entry .qt{
  margin-top:5px;font-size:13px;line-height:1.8;letter-spacing:.05em;font-style:normal;
  color:rgba(244,240,234,.58);
  text-shadow:0 1px 3px rgba(2,4,10,.9), 0 0 14px rgba(2,4,10,.7);
  transition:color .6s ease;
}
.entry.active .qo{color:var(--gold);text-shadow:0 0 22px rgba(216,201,163,.28);}
.entry.active .qt{color:rgba(216,201,163,.5);}
.entry:not(.active):hover .qo{color:rgba(244,240,234,.95);}

/* 世界篇/时间长河：压缩每条“原文 + 译文 + 出处”的占地面积，避免在星河中互相压叠 */
body[data-mode="world"] .entry,body[data-mode="river"] .entry{max-width:252px;}
body[data-mode="world"] .entry::before,body[data-mode="river"] .entry::before{inset:-13px -20px;}
body[data-mode="world"] .entry .qo,body[data-mode="river"] .entry .qo{
  font-size:13.2px;line-height:1.58;letter-spacing:.02em;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
body[data-mode="world"] .entry .qt,body[data-mode="river"] .entry .qt{
  margin-top:4px;font-size:11.3px;line-height:1.58;letter-spacing:.04em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
body[data-mode="world"] .entry .m,body[data-mode="river"] .entry .m{
  margin-top:5px;font-size:9.5px;letter-spacing:.08em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* 世界篇/时间长河聚光文字改为低位置的横排“字幕”，不再用大面积竖排占据画面 */
body[data-mode="world"] .spot,body[data-mode="river"] .spot{
  left:clamp(24px,6.5vw,92px);top:auto;bottom:132px;transform:none;
  writing-mode:horizontal-tb;
  max-width:min(520px,44vw);max-height:32vh;
  padding:2px 0 2px 18px;
  border-left:1px solid rgba(216,201,163,.24);
  font-size:clamp(17px,1.55vw,21px);
  line-height:1.75;letter-spacing:.08em;
  background:linear-gradient(90deg,rgba(4,6,12,.24),rgba(4,6,12,0) 78%);
}
body[data-mode="world"] .spot .who,body[data-mode="river"] .spot .who{
  display:block;margin:0 0 8px;
  font-size:clamp(10.5px,1vw,12.5px);letter-spacing:.18em;
}
body[data-mode="world"] .spot-verse,body[data-mode="river"] .spot-verse{display:flex;flex-direction:column;gap:7px;white-space:normal;}
body[data-mode="world"] .spot-verse .orig,body[data-mode="river"] .spot-verse .orig{
  font-family:"EB Garamond","Noto Serif SC",serif;font-style:italic;
  font-size:1.02em;line-height:1.55;
}
body[data-mode="world"] .spot-verse .trans,body[data-mode="river"] .spot-verse .trans{
  font-size:.72em;line-height:1.7;color:rgba(244,240,234,.62);
}

.era{
  position:absolute;left:0;top:0;pointer-events:none;
  will-change:transform,opacity;
  font-family:var(--kai);
  font-size:13px;letter-spacing:.5em;text-indent:.5em;
  color:rgba(216,201,163,.5);
  writing-mode:vertical-rl;
  text-shadow:0 0 14px rgba(216,201,163,.18);
}
.era .sub{
  font-family:"EB Garamond",serif;font-size:10px;letter-spacing:.2em;
  color:rgba(244,240,234,.28);margin-top:10px;writing-mode:vertical-rl;
}
.era.yr{writing-mode:horizontal-tb;}
.era.yr .sub{display:none;}

/* ---------- 左中竖排大字浮现 ---------- */
.spot{
  position:fixed;z-index:5;pointer-events:none;
  left:calc(max(15vw,150px) );top:50%;transform:translateY(-50%);
  writing-mode:vertical-rl;
  font-family:var(--kai);
  font-size:clamp(22px,3.2vw,34px);
  letter-spacing:.42em;line-height:2.1;
  color:rgba(244,240,234,.85);
  text-shadow:0 1px 4px rgba(2,4,10,.85), 0 0 26px rgba(2,4,10,.55), 0 0 40px rgba(243,233,207,.14);
  max-height:74vh;overflow:hidden;
  opacity:0;transition:opacity 1s ease;
  user-select:none;
}
.spot.show{opacity:1;}
.spot .who{
  margin-right:30px;font-size:clamp(11px,1.2vw,14px);letter-spacing:.34em;
  color:rgba(216,201,163,.55);
}
.spot-verse{display:inline-block;white-space:pre-wrap;}
/* ============ 中文诗歌/歌词 高光条：按模式分竖版 / 横版 ============
   · 竖版：中文诗歌 / 中文歌曲  → 整块竖排（vertical-rl），诗体按句拆两列竖排
   · 横版：时间长河 / 世界诗乐  → 整块横排（horizontal-tb），诗体保持原文排版、自然换行、不拆列
   无论横竖，标题行(.who) 与诗体(.spot-poem*) 采用同一书写方向 → 彼此平行（既不互相垂直、也不另起一列并排），
   标题作为「引题」置于诗体之前（同一流向的头部）。诗体单独用 .spot-poem-cols / .spot-poem-plain
   （不复用 .spot-verse），避免被 world/river 的 .spot-verse 规则干扰。 */

/* —— 竖版：中文诗歌 / 中文歌曲（标题恒在诗句「右侧」） —— */
/* 用 flex 显式排布，不再依赖 vertical-rl 的行内换行：
   竖排时短标题会与诗体挤进同一列，窄屏下就跑到诗句「上方」——这是 bug 根源。
   这里把整块改成横向 flex（row-reverse），DOM 顺序是 [标题][诗体]，
   reverse 后标题落在最右、诗体在其左；两块各自再切回竖排。 */
body[data-mode="poem"] .spot.poem,
body[data-mode="song"] .spot.poem{
  writing-mode:horizontal-tb;
  display:flex;flex-direction:row-reverse;align-items:flex-start;
  gap:clamp(14px,1.8vw,28px);
  max-height:none;overflow:visible;
}
/* 诗体：两竖列并列，第一列在右（传统竖排序） */
body[data-mode="poem"] .spot-poem-cols,
body[data-mode="song"] .spot-poem-cols{
  display:flex;flex-direction:row-reverse;align-items:flex-start;
  writing-mode:horizontal-tb;
  gap:clamp(16px,2vw,34px);margin:0;
  font-size:clamp(18px,2.3vw,26px);line-height:2;letter-spacing:.16em;
}
body[data-mode="poem"] .spot-poem-cols .spot-col,
body[data-mode="song"] .spot-poem-cols .spot-col{ writing-mode:vertical-rl; }
body[data-mode="poem"] .spot-poem-cols .spot-line,
body[data-mode="song"] .spot-poem-cols .spot-line{ display:inline-block;white-space:nowrap;word-break:keep-all; }
/* 标题：竖排，作为 flex 第二块 → 恒落在诗句右侧（与诗句平行，同为竖排） */
body[data-mode="poem"] .spot.poem>.who,
body[data-mode="song"] .spot.poem>.who{
  writing-mode:vertical-rl;align-self:flex-start;
  margin:0;white-space:nowrap;
  font-size:clamp(11px,1.15vw,14px);letter-spacing:.32em;
}

/* —— 横版：时间长河 / 世界诗乐（保持原文排版，不拆列） —— */
body[data-mode="river"] .spot.poem,
body[data-mode="world"] .spot.poem{
  writing-mode:horizontal-tb;       /* 整块横排：标题与诗体同为横版、彼此平行 */
  max-width:min(720px,64vw);        /* 放宽宽度，避免长句被压成过窄竖条 */
  max-height:80vh;overflow:visible; /* 抬高高度上限，避免后面文字被裁切消失 */
  bottom:140px;
}
body[data-mode="river"] .spot.poem>.who,
body[data-mode="world"] .spot.poem>.who{
  display:block;writing-mode:horizontal-tb;margin:0 0 .6em;
  font-size:clamp(11px,1.1vw,13.5px);letter-spacing:.18em;color:rgba(216,201,163,.62);
}
body[data-mode="river"] .spot-poem-plain,
body[data-mode="world"] .spot-poem-plain{
  display:block;writing-mode:horizontal-tb;
  white-space:normal;word-break:normal;
  font-size:clamp(18px,2.3vw,24px);line-height:2;letter-spacing:.16em;margin:0;
  max-height:none;overflow:visible;
}

/* ---------- 底部提示 ---------- */
.hint{
  position:fixed;z-index:6;bottom:80px;left:50%;transform:translateX(-50%);
  font-size:12.5px;letter-spacing:.42em;text-indent:.42em;
  color:rgba(244,240,234,.34);
  pointer-events:none;
  transition:opacity 1.4s ease;
  animation:hintBreathe 5.2s ease-in-out infinite;
  white-space:nowrap;
}
@keyframes hintBreathe{0%,100%{opacity:.5}50%{opacity:1}}
.hint.gone{opacity:0 !important;animation:none;}

/* ---------- 着陆页 ---------- */
.mode-switch,.chips,.entries{transition:opacity .9s ease;}
body.landing .mode-switch,body.landing .chips,body.landing .entries{opacity:0 !important;pointer-events:none !important;}
body.landing .entry{pointer-events:none !important;}
.site-title h1{transition:font-size 1.5s ease,color 1.5s ease;}
.site-title p{transition:font-size 1.5s ease,color 1.5s ease;}
body.landing .site-title h1{font-size:58px;color:rgba(244,240,234,.94);text-shadow:0 0 44px rgba(243,233,207,.16);}
body.landing .site-title p{font-size:17px;color:rgba(244,240,234,.5);}
body.landing .hint{animation:hintBreathe 2s ease-in-out infinite;bottom:44px;}

/* ---------- 黑场过渡 ---------- */
.veil{
  position:fixed;inset:0;z-index:20;background:#04050a;
  opacity:0;pointer-events:none;
  transition:opacity .6s ease;
}
.veil.on{opacity:1;}

.locked *{cursor:default !important;}

/* ==================== 署名说明 + 拾月集（摘抄本） ==================== */
.credit-note{
  position:fixed;z-index:8;right:26px;bottom:82px;
  font-size:10.5px;letter-spacing:.16em;text-align:right;line-height:1.9;
  color:rgba(216,201,163,.34);user-select:none;pointer-events:none;
  text-shadow:0 1px 3px rgba(2,4,10,.8);
}
.notebook-btn{
  position:fixed;z-index:9;right:22px;bottom:26px;
  display:flex;align-items:center;gap:8px;
  font-family:var(--kai);font-size:13.5px;letter-spacing:.24em;text-indent:.06em;
  color:rgba(216,201,163,.72);
  background:rgba(10,14,24,.42);
  border:1px solid rgba(216,201,163,.26);border-radius:999px;
  padding:8px 18px 8px 16px;cursor:pointer;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  transition:color .5s,border-color .5s,box-shadow .5s;
}
.notebook-btn:hover{color:rgba(243,233,207,.95);border-color:rgba(216,201,163,.5);box-shadow:0 0 24px rgba(216,201,163,.10);}
.nb-count{
  min-width:18px;height:18px;border-radius:999px;
  display:none;align-items:center;justify-content:center;
  font-size:10.5px;letter-spacing:0;text-indent:0;
  background:rgba(216,201,163,.9);color:#0a0d18;padding:0 5px;
}
.nb-count.on{display:inline-flex;}
.nb-count.bump{animation:nbBump .6s ease;}
@keyframes nbBump{30%{transform:scale(1.35);}100%{transform:scale(1);}}
body.landing .credit-note,body.landing .notebook-btn{opacity:0 !important;pointer-events:none !important;}
.credit-note,.notebook-btn{transition:opacity 1.2s ease;}
.notebook-btn{transition:opacity 1.2s ease,color .5s,border-color .5s,box-shadow .5s;}

/* 底部时间线滚轮：快速溯游 */
.timeline-scrub{
  position:fixed;z-index:5;left:0;right:0;bottom:0;height:64px;cursor:ew-resize;
  opacity:0;pointer-events:none;transition:opacity 1.2s ease;
  touch-action:none;
}
body:not(.landing) .timeline-scrub{opacity:1;pointer-events:auto;}
.timeline-scrub.ts-off{opacity:0 !important;pointer-events:none !important;}
.ts-band{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(7,10,22,.28) 34%,rgba(8,12,26,.55));
  border-top:1px solid rgba(190,202,240,.06);
}
.ts-ticks{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.ts-tick{position:absolute;bottom:14px;width:1px;transform:translateX(-.5px);background:rgba(198,208,238,.15);}
.ts-tick.mj{height:15px;background:rgba(216,226,252,.34);box-shadow:0 0 4px rgba(190,205,250,.18);}
.ts-tick.mn{height:7px;}
.ts-lab{position:absolute;bottom:33px;transform:translateX(-50%);
  font-family:"Courier New",monospace;font-size:9.5px;letter-spacing:.14em;
  color:rgba(210,220,248,.38);white-space:nowrap;}
.ts-line{position:absolute;left:0;right:0;bottom:21px;height:1px;
  background:linear-gradient(90deg,rgba(190,202,240,.02),rgba(208,220,250,.16) 10%,rgba(208,220,250,.16) 90%,rgba(190,202,240,.02));}
.ts-dot{
  position:absolute;bottom:15px;left:0;width:13px;height:13px;border-radius:50%;
  background:radial-gradient(circle at 38% 32%, #fff6da, #d9b96e 74%);
  box-shadow:0 0 12px rgba(233,201,122,.75);
  transform:translateX(-50%);
}
.timeline-scrub:hover .ts-dot{box-shadow:0 0 22px rgba(233,201,122,.95);}
.ts-year{position:absolute;bottom:46px;left:0;transform:translateX(-50%);
  font-family:"Courier New",monospace;font-size:11px;letter-spacing:.18em;
  color:rgba(240,226,186,.66);text-shadow:0 0 9px rgba(233,201,122,.30);
  white-space:nowrap;pointer-events:none;}
@media (max-width:768px){
  .ts-lab{font-size:8.5px;letter-spacing:.08em;}
  .ts-lab.v{writing-mode:vertical-rl;font-size:9px;letter-spacing:.12em;}
  .ts-year{font-size:10px;bottom:50px;}
}

/* ---------- 新手教学：溯游指南 ---------- */
/* 高亮用「挖洞」实现：ring 的 box-shadow 铺满全屏，只有框内不被压暗 */
.guide{position:fixed;inset:0;z-index:40;opacity:0;pointer-events:none;transition:opacity .9s ease;}
.guide.on{opacity:1;}
.gd-dim{position:absolute;inset:0;background:rgba(5,7,14,.46);transition:opacity .6s ease;}
.guide[data-cut="1"] .gd-dim{opacity:0;}
.gd-ring{
  position:absolute;border-radius:16px;opacity:0;pointer-events:none;
  border:1px solid rgba(226,205,150,.46);
  box-shadow:0 0 0 9999px rgba(5,7,14,.46), 0 0 30px rgba(233,201,122,.2);
  transition:opacity .6s ease,left .34s ease,top .34s ease,width .34s ease,height .34s ease;
}
.gd-ring.on{opacity:1;}
.gd-ring::after{content:'';position:absolute;inset:-7px;border-radius:22px;border:1px solid rgba(233,201,122,.14);}
.gd-card{
  position:absolute;left:50%;transform:translateX(-50%);bottom:104px;

/* ---------------- 基础工具 ---------------- */
const MOBILE = innerWidth < 768 || (navigator.hardwareConcurrency||8) < 6;
const DPR = Math.min(devicePixelRatio||1, 2);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp  = (a,b,t)=>a+(b-a)*t;
const smootherstep = t => { t=clamp(t,0,1); return t*t*t*(t*(t*6-15)+10); };
// mulberry32 确定性随机
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
// value noise 2D
function makeNoise(seed){
  const r=rng(seed), size=256, grid=new Float32Array(size*size);
  for(let i=0;i<grid.length;i++) grid[i]=r();
  const at=(x,y)=>grid[((y&255)*size)+(x&255)];
  const fade=t=>t*t*(3-2*t);
  return function(x,y){
    const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
    const u=fade(xf), v=fade(yf);
    return lerp(lerp(at(xi,yi),at(xi+1,yi),u), lerp(at(xi,yi+1),at(xi+1,yi+1),u), v);
  };
}
function fbm(noise,x,y,oct=4,lac=2,gain=.5){
  let s=0,a=1,f=1,n=0;
  for(let i=0;i<oct;i++){ s+=a*noise(x*f,y*f); n+=a; a*=gain; f*=lac; }
  return s/n;
}
/* ---------------- Renderer / Scene / Camera ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias:!MOBILE, alpha:false, powerPreference:'high-performance' });
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; // 压缩高光，月海低对比不被削顶
renderer.toneMappingExposure = 1.05;
renderer.domElement.className='webgl';
document.body.appendChild(renderer.domElement);
renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, .1, 4000);

const FOGS = {
  cosmos:  { color:new THREE.Color('#07090f'), density:0.0016 },
  desert:  { color:new THREE.Color('#0b0a08'), density:0.0026 },
  sea:     { color:new THREE.Color('#070c12'), density:0.0022 },
  libai:   { color:new THREE.Color('#0a0e13'), density:0.0026 },
  sushi:   { color:new THREE.Color('#0a0b0c'), density:0.0024 },
};
const BGS = {
  cosmos:new THREE.Color('#05070e'), desert:new THREE.Color('#0a0906'),
  sea:new THREE.Color('#060a10'), libai:new THREE.Color('#080c11'), sushi:new THREE.Color('#090a0b'),
};
scene.fog = new THREE.FogExp2(FOGS.cosmos.color.clone(), FOGS.cosmos.density);
scene.background = BGS.cosmos.clone();

/* ---------------- 程序化纹理 ---------------- */
function canvasTexture(w,h,draw){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
// 月球基底场：低频月海 + 细腻斑驳（低对比！供 albedo/bump 共用）
function computeMoonBase(W,H){
  const n1=makeNoise(20240), n2=makeNoise(9301);
  const out=new Float32Array(W*H*2); // [alb, bump]
  const sstep=(a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
  for(let y=0;y<H;y++){
    const v=y/H;
    for(let x=0;x<W;x++){
      const u=x/W;
      const wrap=Math.min(1, x/(W*0.06), (W-x)/(W*0.06));
      let large=fbm(n1,u*3.2+7.3,v*1.7+3.1,4,2.05,.55); // 月海低频场
      let mid  =fbm(n1,u*11+2.0,v*5.5+8.0,4,2.1,.5);
      let fine =fbm(n2,u*46,v*23,4,2.05,.55);
      if(wrap<1){ // 经度接缝混合
        const u2=u+(u<0.5?1:-1);
        large=lerp(fbm(n1,u2*3.2+7.3,v*1.7+3.1,4,2.05,.55),large,wrap);
        mid  =lerp(fbm(n1,u2*11+2.0,v*5.5+8.0,4,2.1,.5),mid,wrap);
        fine =lerp(fbm(n2,u2*46,v*23,4,2.05,.55),fine,wrap);
      }
      const i=(y*W+x)*2;
      const maria=sstep(0.54,0.78,large);            // 柔和羽化的月海掩码（无硬边）
      const alb=235 - maria*34 + (mid-0.5)*10 + (fine-0.5)*9;  // 月海差值 ≤~14%
      const bmp=140 + (mid-0.5)*34 + (fine-0.5)*46 - maria*18; // 月海内部更平滑
      out[i]=clamp(alb,196,244);
      out[i+1]=clamp(bmp,60,220);
    }
  }
  return out;
}
// 环形山：少而柔，大部分很小，alpha ≤0.12，边缘羽化，严禁生硬圆环
function drawCraters(ctx,W,H,seed,forBump){
  const r=rng(seed);
  const count=15+Math.floor(r()*9); // 15–23 个
  let raysLeft=3;
  for(let i=0;i<count;i++){
    const cx=r()*W, cy=H*0.10+r()*H*0.80;
    const rad=3+Math.pow(r(),2.4)*24; // 大部分 <10px，极少量 ~20px
    const a=(0.05+r()*0.065)*(forBump?1.15:1); // ≤0.12
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,rad);
    if(forBump){
      g.addColorStop(0,`rgba(255,255,255,${(a*0.8).toFixed(3)})`);
      g.addColorStop(0.5,`rgba(0,0,0,${a.toFixed(3)})`);
      g.addColorStop(1,'rgba(0,0,0,0)');
    }else{
      g.addColorStop(0,`rgba(232,227,214,${(a*0.6).toFixed(3)})`);
      g.addColorStop(0.45,`rgba(105,101,94,${a.toFixed(3)})`);
      g.addColorStop(1,'rgba(105,101,94,0)');
    }
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(cx,cy,rad,0,Math.PI*2); ctx.fill();
    // 2–3 个稍明显的环形山带淡淡放射纹
    if(rad>13 && raysLeft>0){
      raysLeft--;
      const rays=6+Math.floor(r()*4);
      for(let k=0;k<rays;k++){
        const ang=r()*Math.PI*2;
        const len=rad*(2.6+r()*3.2);
        const lg=ctx.createLinearGradient(cx,cy,cx+Math.cos(ang)*len,cy+Math.sin(ang)*len);
        lg.addColorStop(0,`rgba(240,236,224,${forBump?0.05:0.035})`);
        lg.addColorStop(1,'rgba(240,236,224,0)');
        ctx.strokeStyle=lg;
        ctx.lineWidth=1.2+r()*2.2;
        ctx.beginPath();
        ctx.moveTo(cx+Math.cos(ang)*rad*0.7, cy+Math.sin(ang)*rad*0.7);
        ctx.lineTo(cx+Math.cos(ang)*len, cy+Math.sin(ang)*len);
        ctx.stroke();
      }
    }
  }
}
function buildMoonTextures(){
  const W=1024,H=512;
  const base=computeMoonBase(W,H);
  const albedo=canvasTexture(W,H,(ctx)=>{
    const img=ctx.createImageData(W,H), d=img.data;
    for(let i=0;i<W*H;i++){
      const b=base[i*2];
      const warm=clamp((b-198)/44,0,1);  // 越亮越暖：亮部 ≈ #ece7d8，月海偏中性灰
      d[i*4]=b; d[i*4+1]=b-3-warm*2; d[i*4+2]=b-9-warm*11; d[i*4+3]=255;
    }
    ctx.putImageData(img,0,0);
    drawCraters(ctx,W,H,777,false);
  });

const starUniforms = { uTime:{value:0}, uPixelRatio:{value:DPR} };
function makeStars(count, band){
  const r = rng(band?4242:1313);
  const pos = new Float32Array(count*3);
  const size = new Float32Array(count);
  const ph = new Float32Array(count);
  const spd = new Float32Array(count);
  const col = new Float32Array(count*3);
  const hero = new Float32Array(count); // 1–2% 明亮主星
  // 银河带参数：倾斜平面
  const axisA = new THREE.Vector3(1, .18, .12).normalize();
  const axisB = new THREE.Vector3(-.15, .9, .25).normalize();
  const nz = makeNoise(555);
  for(let i=0;i<count;i++){
    let x,y,z;
    if(band){
      const t=(r()*2-1)*900, s=(r()*2-1);
      const spread = (Math.abs(s)<1? Math.sign(s)*Math.pow(Math.abs(s),1.7):s)*90;
      x = axisA.x*t + axisB.x*spread + (nz(i%97,(i*7)%89)-.5)*40;
      y = axisA.y*t + axisB.y*spread + (nz((i*3)%83,(i*11)%61)-.5)*30 + 40;
      z = axisA.z*t + axisB.z*spread + (nz((i*13)%79,(i*5)%71)-.5)*40;
    }else{
      const rad = 220 + r()*760;
      const th = r()*Math.PI*2;
      const phi = Math.acos(2*r()-1);
      x = rad*Math.sin(phi)*Math.cos(th);
      y = rad*Math.cos(phi)*.8 + 40;
      z = rad*Math.sin(phi)*Math.sin(th);
    }
    pos[i*3]=x; pos[i*3+1]=y; pos[i*3+2]=z;
    const isHero = !band && r()<0.016;
    hero[i] = isHero?1:0;
    size[i] = isHero? 2.6+r()*0.9 : (band? .55+r()*1.1 : .5+r()*2.2);
    ph[i] = r()*Math.PI*2;
    spd[i] = (Math.PI*2)/(2.4+r()*5.2);
    const c = r();
    let cr,cg,cb;
    if(c<.55){ cr=1.0; cg=.99; cb=.95; }        // 暖白
    else if(c<.85){ cr=.88; cg=.92; cb=1.0; }   // 冷白
    else{ cr=1.0; cg=.94; cb=.78; }             // 微金
    let dim = band? .7+r()*.5 : .8+r()*.35;
    if(isHero) dim*=1.5;
    col[i*3]=cr*dim; col[i*3+1]=cg*dim; col[i*3+2]=cb*dim;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setAttribute('aSize', new THREE.BufferAttribute(size,1));
  g.setAttribute('aPhase', new THREE.BufferAttribute(ph,1));
  g.setAttribute('aSpeed', new THREE.BufferAttribute(spd,1));
  g.setAttribute('aColor', new THREE.BufferAttribute(col,3));
  g.setAttribute('aHero', new THREE.BufferAttribute(hero,1));
  const m = new THREE.ShaderMaterial({
    uniforms: starUniforms,
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    vertexShader:`
      attribute float aSize, aPhase, aSpeed, aHero;
      attribute vec3 aColor;
      uniform float uTime, uPixelRatio;
      varying float vA; varying vec3 vC;
      void main(){
        float tw = sin(aPhase + uTime*aSpeed*(1.0+aHero*.9));
        float amp = mix(0.90, 1.0, aHero);
        vA = (0.05 + amp*smoothstep(-1.0,1.0,tw)) * (1.0 + aHero*.9);
        vC = aColor;
        vec4 mv = modelViewMatrix * vec4(position,1.0);
        float ps = aSize * (1.0 + (0.28+0.25*aHero)*sin(aPhase*1.7 + uTime*aSpeed*.7));
        gl_PointSize = ps * uPixelRatio * (260.0 / -mv.z);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader:`
      varying float vA; varying vec3 vC;
      void main(){
        float d = length(gl_PointCoord - .5);
        float a = smoothstep(.5, .06, d) * vA;
        gl_FragColor = vec4(vC, a);
      }`,
  });
  const pts = new THREE.Points(g,m);
  pts.frustumCulled = false;
  return pts;
}

  const m=new THREE.Mesh(geo,mat);
  m.position.z=z;

}

const seaUniforms={
  uTime:{value:0},

buildSceneGroup('sea', (g)=>{
  const geo=new THREE.PlaneGeometry(1600,1000,1,1);
  geo.rotateX(-Math.PI/2);
  const mat=new THREE.ShaderMaterial({
    uniforms:seaUniforms,
    fog:false,
    vertexShader:`
      varying vec3 vW;
      void main(){
        vec4 w = modelMatrix * vec4(position,1.0);
        vW = w.xyz;
        gl_Position = projectionMatrix * viewMatrix * w;
      }`,
    fragmentShader:`
      uniform float uTime, uMoonX, uLit, uFogDensity;
      uniform vec3 uFogColor;
      varying vec3 vW;
      float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
      float noise(vec2 p){
        vec2 i=floor(p), f=fract(p);
        f=f*f*(3.-2.*f);
        return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),
                   mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
      }
      void main(){
        vec2 p = vW.xz;
        float d = length(vW - cameraPosition);
        // 波纹法线扰动
        float w1 = sin(p.x*.14 + uTime*.8) + sin(p.y*.11 - uTime*.6);
        float w2 = noise(p*.06 + uTime*.05)*4.;
        // 深水基色
        vec3 base = vec3(.016,.028,.040) + vec3(.010,.016,.022)*noise(p*.02+uTime*.03);
        // 月光倒影光路：月亮屏幕竖线下方的粼粼光柱
        float dx = abs(p.x - uMoonX);
        float path = exp(-dx*dx/240.0) * (1.0 - smoothstep(-420., 60., p.y));
        float sparkle = noise(vec2(p.x*1.4, p.y*.5 - uTime*1.2)) * noise(vec2(p.x*.7+9., p.y*.9 + uTime*.8));
        sparkle = pow(sparkle, 2.6)*3.2;
        float glint = smoothstep(.75,1.,noise(p*vec2(1.2,.5)+vec2(0.,-uTime*1.5)));
        vec3 moonCol = vec3(.93,.89,.78);
        vec3 col = base + moonCol * path * (0.30 + sparkle*.55 + glint*.6) * (0.25+0.75*uLit);
        // 普通波光
        col += vec3(.5,.55,.6) * max(0., w1+w2-2.6)*.02;
        // 地平线雾亮
        col = mix(col, uFogColor, smoothstep(200., 900., d));
        gl_FragColor = vec4(col, 1.0);
      }`,
  });
  const sea=new THREE.Mesh(geo,mat);
  sea.position.set(0,-8,-260);
  g.add(sea);

  const hz=new THREE.Mesh(

const entriesEl = document.getElementById('entries');
const spotEl = document.getElementById('spot');
const hintEl = document.getElementById('hint');
if(matchMedia('(pointer:coarse)').matches) hintEl.textContent='抚过月面 · 变幻月相，轻点月亮 · 进入时间长河';
const veilEl = document.getElementById('veil');
const chipsEl = document.getElementById('chips');
const modeEl = document.getElementById('modeSwitch');

const state = {
  mode:'poem', theme:'全部',
  items:[], entries:[], eras:[],
  camZ:0, camTargetZ:0, maxZ:0, minZ:0,
  selected:-1, locked:false, landed:false,
  moonFracY:.30,
};
const THEME_SCENE = {'全部':'cosmos','李白的月亮':'libai','苏轼的月亮':'sushi','中秋的月亮':'sea','边关的月亮':'desert'};
const SPACING = 70; // ×1.4 拉开相邻条目 z 间距，避免中段投影相撞
function flowSpacing(){ return (state.mode==='world'||state.mode==='river') ? 86 : SPACING; } // 世界篇/长河文字更宽，时间轴间距再拉开
const AMP_SCALE = clamp(innerWidth/1280, .5, 1); // 窄屏等比收窄横向振幅，保证移动端条目不出屏
const FIRST_VIEW_D = 80; // 第一条目初始视距：投影落在视口内、opacity 处于高亮区
// 初始/切换后的相机起点：让第一条目距离相机 d≈80；竖屏投影更靠外时自动加大视距收回视口
function initialCamZ(){
  const p0 = anchorPos(0);
  const tanH = Math.tan(camera.fov*Math.PI/360);
  let d = FIRST_VIEW_D;
  const halfW = tanH*d*camera.aspect;
  if (Math.abs(p0.x) > halfW*0.5) d = Math.abs(p0.x)/(0.5*tanH*camera.aspect);
  return p0.z - d;
}

function worldYear(n){ const m=/前\s*(\d+)/.exec(n); if(m) return -parseInt(m[1],10); const v=parseInt(n,10); return isNaN(v)?9999:v; }
function isSongIt(it){ return it.orig===undefined && it.y!==undefined; }
/* 条目署名：中文＝作者/演唱 · 《作品》（歌曲附词曲）；世界＝作者 · 《作品》（附译者） */
function whoOf(it){
  if(it.orig!==undefined) return [it.author, it.title, it.tr].filter(Boolean).join(' · ');
  return `${it.a} · 《${it.s}》${isSongIt(it)?' ♫':''}${it.cr?' · '+it.cr:''}`;
}
function flowItems(){
  if(state.mode==='song') return SONGS.slice();
  if(state.mode==='world') return WORLD.slice();
  if(state.mode==='river'){ // 时间长河：三者合并，按系年顺流而下
    const a=POEMS.map(p=>({...p, yk:POEM_Y[p.a+'|'+p.s]??9999}));
    const b=SONGS.map(s=>({...s, yk:s.y}));
    const c=WORLD.map(w=>({...w, yk:worldYear(w.node)}));
    return a.concat(b,c).sort((x,y)=>x.yk-y.yk);
  }
  if(state.theme==='全部') return POEMS.slice();
  return POEMS.filter(p=>p.themes.includes(state.theme));
}
function anchorPos(i){
  const r=rng(5000+i*37);
  const side = i%2===0? -1: 1;
  // 奇数条目略上浮、偶数略下沉（中距离屏幕等效约 ±40px），进一步错开
  const yParity = (i%2===0? -1: 1)*4.5;
  // 横向振幅加大：左右条目投影在屏幕中线两侧保持充足间距
  const lateral = (state.mode==='world'||state.mode==='river') ? 25 : 24;
  return new THREE.Vector3(side*(lateral+r()*8)*AMP_SCALE, 6+(i%3)*4.6+(r()-.5)*3+yParity, 34+i*flowSpacing());
}
function buildFlow(){
  entriesEl.innerHTML='';
  state.entries=[]; state.eras=[];
  state.items=flowItems();
  const isRiver = state.mode==='river';
  const isSong = state.mode==='song';
  const isWorld = state.mode==='world';
  let lastKey=null;
  const seenDyn=new Set(); // 长河中朝代节点只标一次（避免「现代」在年月之间反复闪现）
  state.items.forEach((it,i)=>{
    const iw = it.orig!==undefined;          // 世界诗乐条目
    const isg = isSongIt(it);                // 中文歌曲条目
    const key = isRiver ? (iw? it.node : (isg? it.y : it.d)) : (isSong? it.y : (isWorld? it.node : it.d));
    // 年代节点
    const dynKey = isRiver && !iw && !isg;   // 长河里的朝代型节点
    if(key!==lastKey && (!dynKey || !seenDyn.has(key))){
      lastKey=key;
      if(dynKey) seenDyn.add(key);
      const dyn = !iw && !isg; // 中文诗歌：朝代样式，其余为年份样式
      const el=document.createElement('div');
      el.className='era'+(dyn && !isSong && !isWorld ? '' : ' yr');
      el.innerHTML = (dyn && !isSong && !isWorld)? `${key}<span class="sub">${ERA_SUB[key]||''}</span>` : `${key}`;
      entriesEl.appendChild(el);
      const p=anchorPos(i);
      state.eras.push({el, anchor:new THREE.Vector3(-p.x*0.9, p.y+6, p.z-16), i});
    }else lastKey=key;
    const el=document.createElement('div');
    el.className='entry';
    if(iw){
      const jp=/[\u3040-\u30ff]/.test(it.orig); // 日文原文：明朝体，不斜体
      const meta=[it.author, it.title, it.tr, it.node].filter(Boolean).join(' · ');
      el.innerHTML=`<div class="qo${jp?' jp':''}">${it.orig}</div><div class="qt">${it.trans}</div><div class="m">${meta}</div>`;
    }else{
      el.innerHTML=`<div class="q">「${it.t}」</div><div class="m">${whoOf(it)}</div>`;
    }
    el.addEventListener('click',(ev)=>{ ev.stopPropagation(); selectEntry(i); });
    el.addEventListener('dblclick',(ev)=>{ // 双击 = 直接收进拾月集
      ev.stopPropagation();
      if(state.locked || !state.landed) return;
      if(collectEntry(i)){
        flashCollected(el);
        if(state.selected===i && spotEl.classList.contains('show')) syncCollectBtn();
      }
    });
    entriesEl.appendChild(el);
    state.entries.push({el, anchor:anchorPos(i), ph:i*1.37});
  });
  // 底部缓停时让末条停在身前（d≈30，仍清晰可见）而非彻底掠过身后
  state.maxZ = state.items.length? Math.max(0, 34+(state.items.length-1)*flowSpacing()-30) : 0;
  state.minZ = initialCamZ();
  state.camZ = state.minZ; state.camTargetZ = state.minZ;
  tsBuild();
}

/* ---------------- 拾月集：摘抄本（localStorage 持久化） ---------------- */
const NB_KEY='moonJournalV1';

      nbCountEl=document.getElementById('nbCount'), collectBtn=document.getElementById('collectBtn');
let journal=[];

function saveJournal(){ try{ localStorage.setItem(NB_KEY, JSON.stringify(journal)); }catch(e){} }
function journalKey(it){ const isW=it.orig!==undefined; return (isW?it.orig:it.t)+'@'+(isW?it.author+it.title:it.a+it.s); }
function isCollected(it){ const k=journalKey(it); return journal.some(j=>j.k===k); }
function escHtml(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function updateNbCount(bump){
  nbCountEl.textContent=journal.length;

    <div class="nb-item" data-k="${escHtml(j.k)}">

      <div class="nb-text">${j.orig? `<span class="nb-orig">${escHtml(j.orig)}</span><span class="nb-trans">${escHtml(j.trans)}</span>` : escHtml(j.text)}</div>

/* 拾月集 · 拖拽排序（按住手柄 ⋮⋮ 上下拖动，兼容触摸） */
let nbDrag=null;
nbListEl.addEventListener('pointerdown', ev=>{
  const grip=ev.target.closest('.nb-grip'); if(!grip) return;
  const item=grip.closest('.nb-item'); if(!item || nbDrag) return;
  ev.preventDefault();
  const ph=document.createElement('div');
  ph.className='nb-item nb-placeholder';
  ph.style.height=item.offsetHeight+'px';
  nbDrag={item, ph, startY:ev.clientY, origTop:item.offsetTop, h:item.offsetHeight};
  nbListEl.insertBefore(ph, item);
  item.classList.add('dragging');
  item.style.top=nbDrag.origTop+'px';
  try{ grip.setPointerCapture(ev.pointerId); }catch(e){}
});
nbListEl.addEventListener('pointermove', ev=>{
  if(!nbDrag) return;
  ev.preventDefault();
  const {item, ph, startY, origTop, h}=nbDrag;

function nbmWrap(ctx,text,maxW){
  const lines=[]; let cur='';
  for(const ch of String(text)){
    if(ch==='\n'){ lines.push(cur); cur=''; continue; }
    if(ctx.measureText(cur+ch).width>maxW && cur){ lines.push(cur); cur=ch; }
    else cur+=ch;
  }
  if(cur) lines.push(cur);
  return lines;
}
function nbmSpaced(ctx,text,cx,y,sp){
  const chars=[...text]; const ws=chars.map(c=>ctx.measureText(c).width);
  const total=ws.reduce((a,b)=>a+b,0)+sp*(chars.length-1);

const NBM_MARIA=[[-.28,-.20,.34,.30],[.14,.24,.26,.20],[.36,-.10,.17,.16],[-.04,-.46,.22,.16],[.02,.48,.28,.20],[-.50,.14,.15,.12],[.30,-.38,.13,.12]];
function nbmMoon(ctx,x,y,r,phase,pal){
  if(phase==='none') return;
  // 逐像素球面光照：柔和明暗界线 + 月海斑块 + 边缘抗锯齿（emoji 式自然月相）
  const TH={full:0, gibbous:.60, half:Math.PI/2, crescent:2.31, waning:-2.31};
  const th=TH[phase]??0, Lx=Math.sin(th), Lz=Math.cos(th);
  const S=Math.ceil(r*4);
  if(!nbmMoon.off) nbmMoon.off=document.createElement('canvas');
  const off=nbmMoon.off; off.width=off.height=S;
  const c2=off.getContext('2d');
  const img=c2.createImageData(S,S), d=img.data;
  const hi0=hexRGB(pal.moonHi), sh0=hexRGB(pal.moonSh); const hi=hi0.map(v=>Math.min(255,Math.round(v*1.1))), sh=sh0.map(v=>Math.min(255,Math.round(v*1.1)));
  const half=S/2;
  for(let py=0;py<S;py++) for(let px=0;px<S;px++){
    const nx=(px+.5-half)/half, ny=(py+.5-half)/half, rr=nx*nx+ny*ny;
    if(rr>1) continue;
    const nz=Math.sqrt(1-rr);
    let k=nx*Lx+nz*Lz;                      // 光照强度 = 法线·光线
    k=clamp((k+.10)/.26,0,1); k=k*k*(3-2*k); // 明暗界线柔和过渡
    let m=0;                                 // 月海
    for(const [mx,my,mr,ma] of NBM_MARIA){
      const dx=nx-mx, dy=ny-my, q=(dx*dx+dy*dy)/(mr*mr);
      if(q<1) m=Math.max(m, ma*(1-q)*(1-q));
    }
    const edge=clamp((1-Math.sqrt(rr))*half*1.2,0,1); // 边缘抗锯齿
    const litR=hi[0]*(1-m*.34), litG=hi[1]*(1-m*.34), litB=hi[2]*(1-m*.34);
    const i=(py*S+px)*4;
    d[i]  =sh[0]+(litR-sh[0])*k;
    d[i+1]=sh[1]+(litG-sh[1])*k;
    d[i+2]=sh[2]+(litB-sh[2])*k;
    d[i+3]=255*edge;
  }
  c2.putImageData(img,0,0);
  ctx.save();
  const halo=ctx.createRadialGradient(x,y,r*.65,x,y,r*1.7);
  halo.addColorStop(0,hexA(pal.moonHi,.28)); halo.addColorStop(1,hexA(pal.moonHi,0));
  ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(x,y,r*1.7,0,Math.PI*2); ctx.fill();

}
function nbmTint(img,color,w,h){ // 传统纹样按底色方案的点缀色重新着色（保留透明通道）
  const c=document.createElement('canvas'); c.width=w; c.height=h;

}
function nbmPattern(ctx,W,H,pat,pal){
  if(pat==='none') return;
  const M=110;
  ctx.save();
  if(pat==='huiwen'||pat==='both'){ // 回纹缘饰：顶部（both 时仅顶部）
    const img=nbmImgs.huiwen;
    if(img){
      const bh=42, bw=W-2*M+56;
      const t=nbmTint(img,pal.accent,Math.round(bw),bh);
      ctx.globalAlpha=.5;
      ctx.drawImage(t,M-28,44,bw,bh);
      if(pat==='huiwen') ctx.drawImage(t,M-28,H-44-bh,bw,bh);

  }

    const img=nbmImgs.haishui;
    if(img){

/* 祥云纹：同心云卷 + 横托 + 流云细线（依图3传统祥云纹程序化绘制） */
function nbmPuff(ctx,cx,cy,r){
  [1,.66,.34].forEach(k=>{ ctx.beginPath(); ctx.arc(cx,cy,r*k,0,Math.PI*2); ctx.stroke(); });
  ctx.beginPath(); ctx.arc(cx,cy,Math.max(r*.09,1.4),0,Math.PI*2); ctx.fill();

function nbmXiangyun(ctx,cx,base,s,color){
  ctx.save();
  ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineCap='round';
  const bw=150*s;
  // 云卷簇：中大、右次、左小，底部没入横托（裁剪至横托线以上）
  ctx.save();
  ctx.beginPath(); ctx.rect(cx-bw-30*s, base-95*s, 2*bw+60*s, 93*s); ctx.clip();
  ctx.lineWidth=2.2*s;
  nbmPuff(ctx,cx+4*s,  base-20*s, 30*s);
  nbmPuff(ctx,cx+42*s, base-12*s, 20*s);
  nbmPuff(ctx,cx-38*s, base-8*s,  14*s);
  ctx.restore();
  // 横托
  ctx.beginPath(); ctx.roundRect(cx-bw, base-3.5*s, bw*2, 7*s, 3.5*s); ctx.fill();
  // 两侧流云细线（外长内短、上一下一）
  ctx.lineWidth=1.6*s;
  [[bw+14*s,bw+120*s,-2*s],[bw+28*s,bw+84*s,10*s]].forEach(([a,b,dy])=>{
    ctx.beginPath(); ctx.moveTo(cx+a,base+dy); ctx.lineTo(cx+b,base+dy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx-a,base+dy); ctx.lineTo(cx-b,base+dy); ctx.stroke();
  });

  [1,-1].forEach(d=>{
    ctx.beginPath(); ctx.arc(cx+d*(bw+126*s), base-8*s, 6*s, Math.PI, 0); ctx.stroke();
  });
  ctx.restore();
}
async function nbmRender(){
  await document.fonts.ready;
  const pal=NB_BGS.find(b=>b.id===nbm.bg)||NB_BGS[0];
  const W=1240,H=1754,M=110;
  const ctx=nbmCanvas.getContext('2d');
  const KAI='"Kaiti SC","STKaiti","KaiTi","Noto Serif SC",serif';
  const SERIF='"EB Garamond","Noto Serif SC",serif';
  // 版面自适应：内容超高则整体缩小正文字号（量尺以正文末端为准，结尾钉底不参与）
  let scale=1;
  const seaBand=(nbm.pat==='haishui'||nbm.pat==='both');
  for(;scale>.6;scale-=.05){ if(nbmLayout(ctx,pal,W,H,M,KAI,SERIF,scale,true) <= (seaBand?1302:1402)) break; }
  // 正式绘制
  ctx.fillStyle=pal.bg; ctx.fillRect(0,0,W,H);
  const vg=ctx.createRadialGradient(W/2,H/2,H*.28,W/2,H/2,H*.78);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,pal.id==='xuan'||pal.id==='yuebai'?'rgba(90,70,40,.10)':'rgba(0,0,0,.28)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  nbmPattern(ctx,W,H,nbm.pat,pal);
  nbmLayout(ctx,pal,W,H,M,KAI,SERIF,scale,false);
}
function nbmLayout(ctx,pal,W,H,M,KAI,SERIF,scale,measureOnly){

  // 月相装饰（与顶部云饰/缘饰、标题保持疏朗间距）

  y+=52;
  draw(()=>{ ctx.fillStyle=sub; ctx.font=`${Math.round(21)}px ${KAI}`; nbmSpaced(ctx,'沿途拾月，满笺清辉',W/2,y,6); });

    ctx.beginPath(); ctx.moveTo(M+40,y); ctx.lineTo(W/2-26,y); ctx.moveTo(W/2+26,y); ctx.lineTo(W-M-40,y); ctx.stroke();

function showSpot(it, dur){

  const vertical = (state.mode==='poem' || state.mode==='song'); // 中文诗歌/中文歌曲=竖版；时间长河/世界诗乐=横版
  let verseHtml;

  if(isW){
    verseHtml = `<span class="spot-verse"><span class="orig">${it.orig}</span><span class="trans">${it.trans}</span></span>`;
  }else if(vertical){
    // 竖版：标题与诗体同为竖排（平行）；诗体按句拆成两列竖排，整句不拆字、末字不掉行
    const lines = (it.t.match(/[^，。；、？！]+[，。；、？！]?/g) || [it.t]).filter(Boolean);
    const half = Math.ceil(lines.length/2);

    verseHtml = `<span class="spot-poem spot-poem-cols">${col(lines.slice(0,half))}${col(lines.slice(half))}</span>`;
  }else{
    // 横版：保持原文排版，横向自然换行（句间可断、句中不断），不拆列
    verseHtml = `<span class="spot-poem spot-poem-plain">${it.t}</span>`;
  }
  spotEl.innerHTML = `<span class="who">${who}</span>${verseHtml}`;

const tscrubEl=document.getElementById('tscrub'), tsDotEl=document.getElementById('tsDot'),
      tsTicksEl=document.getElementById('tsTicks'), tsYearEl=document.getElementById('tsYear');
let tsDrag=false;
function tsSet(clientX){
  const r=tscrubEl.getBoundingClientRect();
  const f=Math.min(1,Math.max(0,(clientX-r.left)/r.width));
  const span=state.maxZ-state.minZ;
  if(span>0 && state.landed && !state.locked){
    state.camTargetZ=state.minZ+f*span;
    if(!hintDone){ hintDone=true; hintEl.classList.add('gone'); }
  }
}
tscrubEl.addEventListener('pointerdown',ev=>{ ev.stopPropagation(); tsDrag=true; tscrubEl.setPointerCapture(ev.pointerId); tsSet(ev.clientX); });
tscrubEl.addEventListener('pointermove',ev=>{ if(tsDrag) tsSet(ev.clientX); });
tscrubEl.addEventListener('pointerup',()=>{ tsDrag=false; });
tscrubEl.addEventListener('pointercancel',()=>{ tsDrag=false; });
function tsYearText(y){ if(y>=9000) return '··'; return y<0 ? '前'+(-y) : (''+y); }
function tsYearOf(it){
  if(it.yk!==undefined) return it.yk;
  if(it.orig!==undefined) return worldYear(it.node);
  if(isSongIt(it)) return it.y;
  return POEM_Y[it.a+'|'+it.s]??9999;
}
/* ---------------- 底部时间轴：年份 ↔ 相机 z 的真实映射 ----------------
   条目在 z 轴上是「按序等距」排布的，但它们的系年并不等距：
   中文歌曲里 1940–1977 只有 3 首，1983 年后却有 70 余首；
   只要把年份均匀铺在轴上，刻度所指的位置就会与真实年份错开几十年。
   所以先建立「年份 ↔ z」的分段线性映射，刻度一律落在该年份真实出现的位置。 */
const NICE_Y=[1,2,5,10,20,25,50,100,200,250,500,1000,2000];
let axisPts=null;
function tsBuildAxis(){
  const n=state.items.length, S=flowSpacing(), pts=[];
  for(let i=0;i<n;i++){
    const y=tsYearOf(state.items[i]);
    if(y>=9000) continue;                  // 系年不详的条目不参与建轴
    const z=34+i*S, last=pts[pts.length-1];
    if(last && last.y===y) last.z1=z;      // 同一年份的多个条目并成一个锚点
    else pts.push({y, z, z1:z});
  }
  pts.forEach(p=>{ p.z=(p.z+p.z1)/2; });   // 取首末中点作为该年份的代表位置
  axisPts = pts.length>1 ? pts : null;
}
function tsYearAtZ(z){
  if(!axisPts) return null;
  const A=axisPts[0], L=axisPts[axisPts.length-1];
  if(z<=A.z) return A.y;
  if(z>=L.z) return L.y;
  for(let i=0;i<axisPts.length-1;i++){
    const a=axisPts[i], b=axisPts[i+1];
    if(z<=b.z) return b.y===a.y ? a.y : a.y+(z-a.z)/(b.z-a.z)*(b.y-a.y);
  }
  return L.y;
}
function tsZAtYear(y){
  if(!axisPts) return null;
  const A=axisPts[0], L=axisPts[axisPts.length-1];
  if(y<A.y || y>L.y) return null;
  for(let i=0;i<axisPts.length;i++){
    const p=axisPts[i];
    if(p.y===y) return p.z;
    if(p.y>y){ const a=axisPts[i-1]; return a.z+(y-a.y)/(p.y-a.y)*(p.z-a.z); }
  }
  return null;
}
/* 拨轮刻度：按当前模式的系年范围铺设。诗歌模式标朝代，其余标年份 */
function tsBuild(){
  // 小专题时间跨度小，不铺时间轴
  tscrubEl.classList.toggle('ts-off', state.mode==='poem' && !!state.theme && state.theme!=='全部');
  tsTicksEl.innerHTML='';
  axisPts=null;
  const n=state.items.length, span=state.maxZ-state.minZ;
  if(n<2 || span<=0){ tsYearEl.textContent=''; return; }
  const frag=document.createDocumentFragment();
  const mkTick=(f,cls)=>{ if(f<-0.001||f>1.001) return; const t=document.createElement('i'); t.className='ts-tick '+cls; t.style.left=(f*100)+'%'; frag.appendChild(t); };
  const mkLab=(f,txt,cls,shift)=>{ if(f<0||f>1) return; if(innerWidth<768 && f*innerWidth>innerWidth-118) return; const s=document.createElement('b'); s.className='ts-lab'+(cls?' '+cls:''); s.style.left=(f*100)+'%'; if(shift) s.style.marginLeft=shift+'px'; s.textContent=txt; frag.appendChild(s); };
  if(state.mode==='poem'){
    const seen=new Set();
    const narrow=innerWidth<768;
    let lastRight=-99; // 窄屏相邻标签水平微挪，保持底部对齐
    state.items.forEach((it,i)=>{
      if(seen.has(it.d)) return; seen.add(it.d);
      const f=(34+i*flowSpacing()-state.minZ)/span;
      mkTick(f,'mj');
      const v = narrow && it.d.length===2;
      const px = f*innerWidth, lw = narrow ? (v?13:10) : it.d.length*10;
      let shift = 0;
      if(narrow && px - lw/2 < lastRight + 4) shift = lastRight + 4 - (px - lw/2);
      mkLab(f,it.d,v?'v':'',shift);
      lastRight = px - lw/2 + shift + lw;
    });
  }else{
    tsBuildAxis();                             // 年份型模式才需要建轴（诗歌模式标的是朝代）
    if(axisPts){
      const w=tscrubEl.clientWidth||innerWidth, narrow=w<768;
      const mjGap=narrow?60:76;                 // 相邻年份标签的最小像素间距
      const mnGap=6;                            // 细刻度的最小像素间距
      const padL=44, padR=narrow?146:186;       // 两端留白（右下角有「拾月集」按钮）
      const usa=Math.max(120, w-padL-padR);
      const K=Math.max(3, Math.min(narrow?6:16, Math.round(usa/mjGap)+1));
      const pxOf=z=>((z-state.minZ)/span)*w;
      const stAt=z=>{                           // 该处「一年占几像素」→ 决定标签取整粒度
        const dz=Math.max(1, span*0.02);
        const dens=Math.abs(tsYearAtZ(z+dz)-tsYearAtZ(z-dz))/(2*dz)*(span/w);
        return NICE_Y.find(s=>s>=dens*mjGap)||0;
      };
      const tryAt=(z,st)=>{                     // 按某个粒度取整，再看它落在哪儿、离取样点多远
        const Y=Math.round(tsYearAtZ(z)/st)*st;
        if(Y===0) return null;                  // 没有公元0年
        const zz=tsZAtYear(Y);
        return zz===null? null : {Y, z:zz, st, d:Math.abs(pxOf(zz)-pxOf(z))};
      };
      const cand=z=>{                           // 取整到顺口年份，再落到该年份的真实位置
        const base=stAt(z); if(!base) return null;
        const bi=NICE_Y.indexOf(base);
        let best=tryAt(z,base);
        // 取整后落点偏得太远（密疏反差大的区段）→ 退到更细的粒度里挑最近的一个
        if(!best || best.d>mjGap*0.8){
          for(let k=bi-1;k>=0 && k>=bi-4;k--){
            const c=tryAt(z,NICE_Y[k]);
            if(c && (!best || c.d<best.d)) best=c;
          }
        }
        return best? {Y:best.Y, z:best.z, st:best.st} : null;
      };
      const place=list=>{
        const uniq=new Map();
        list.forEach(c=>{ if(c && !uniq.has(c.Y)) uniq.set(c.Y,c); });
        const out=[]; let last=-1e9;
        [...uniq.values()].sort((a,b)=>a.z-b.z).forEach(c=>{
          const px=pxOf(c.z); if(px<-2 || px>w+2 || px-last<mjGap) return;
          last=px; out.push({Y:c.Y, z:c.z, st:c.st, px});
        });
        return out;
      };
      const A=axisPts[0], L=axisPts[axisPts.length-1];
      // 两端用真实系年兜底，中段按当地粒度取顺口年份
      const list=[{Y:A.y, z:A.z, st:stAt(A.z)||2000},{Y:L.y, z:L.z, st:stAt(L.z)||10}];
      for(let k=0;k<K;k++) list.push(cand(state.minZ+(padL+usa*(K===1?0:k/(K-1)))/w*span));
      let placed=place(list);
      for(let it=0; it<3; it++){                // 标签之间空得太开时，在中间再补一个
        const extra=[];
        for(let i=0;i<placed.length-1;i++){
          if(placed[i+1].px-placed[i].px < mjGap*2.2) continue;
          const c=cand((placed[i].z+placed[i+1].z)/2);
          if(c){ extra.push(c); list.push(c); }
        }
        if(!extra.length) break;
        placed=place(list);
      }
      placed.forEach(c=>{ const f=pxOf(c.z)/w; mkTick(f,'mj'); mkLab(f,tsYearText(c.Y)); });
      // 细刻度：主刻度之间五等分，位置同样取真实年份
      const major=placed.map(c=>c.px);
      const finer=[];
      placed.forEach(c=>{ for(let k=1;k<5;k++) finer.push(c.Y+c.st*k/5); });
      let lastT=-1e9;
      finer.sort((a,b)=>a-b).forEach(Y=>{
        const zz=tsZAtYear(Y); if(zz===null) return;
        const px=pxOf(zz); if(px-lastT<mnGap) return;
        lastT=px;
        if(major.some(p=>Math.abs(p-px)<5)) return;
        mkTick(px/w,'mn');
      });
    }
  }
  tsTicksEl.appendChild(frag);
}
function tsSync(){
  const span=state.maxZ-state.minZ;
  const f=span>0 ? (state.camZ-state.minZ)/span : 0;
  tsDotEl.style.left=(f*100)+'%';
  if(!state.items.length){ tsYearEl.textContent=''; return; }
  // 年份读数与轴上的刻度共用同一套「年份 ↔ z」映射：圆点、刻度、读数三者始终一致
  const i=Math.min(state.items.length-1,Math.max(0,Math.round((state.camZ-34)/flowSpacing())));
  const it=state.items[i];
  let txt=it.d||'';
  if(state.mode!=='poem'){
    const y=tsYearAtZ(state.camZ);
    txt = y===null ? tsYearText(tsYearOf(it)) : tsYearText(Math.round(y));
  }
  if(txt!==tsYearEl.textContent) tsYearEl.textContent=txt;
  // 读数跟随圆点，钳制在两端以内（避开右下按钮区）
  const w=tscrubEl.clientWidth||innerWidth;
  const x=Math.min(w-(innerWidth<768?132:170),Math.max(46,f*w));
  tsYearEl.style.left=x+'px';
}

/* ---------------- 投影 ---------------- */
const projV=new THREE.Vector3();
function projectEntries(t){
  const w=innerWidth, h=innerHeight, isWorld=state.mode==='world';
  // 世界篇在抵达镜头前先开始边界淡出，避免投影奇点造成“撞墙后甩出画面”
  const far=isWorld?170:150, behind=isWorld?10:-8, farFade=isWorld?56:40, nearFade=isWorld?20:7;
  let focusIdx=-1, focusScore=1e9, focusX=0;
  const probes=[];
  const fadeOp = d => {
    if(d<=behind || d>=far) return 0;
    const o = Math.min(smooth01((far-d)/farFade), smooth01((d-behind)/nearFade));
    return Math.pow(o, 1.4); // 中间亮、两头快隐
  };
  const edgeOp = (x,y)=>Math.pow(
    smooth01((x+90)/150)*smooth01((w-x+90)/150)*
    smooth01((y+80)/130)*smooth01((h-y+80)/130), .72
  );
  for(let i=0;i<state.entries.length;i++){
    const e=state.entries[i];
    projV.copy(e.anchor).project(camera);
    const d=e.anchor.z - state.camZ;
    const sx=(projV.x*.5+.5)*w;
    const rawY=(-projV.y*.5+.5)*h;
    let op=fadeOp(d);
    if(isWorld) op*=edgeOp(sx,rawY);
    if(d>-50 && d<190) probes.push({i,x:sx,y:rawY,d,op});
    const score=Math.abs(d-58);
    if(op>.015 && score<focusScore){ focusScore=score; focusIdx=i; focusX=sx; }
    if(op<0.01){ e.el.style.opacity='0'; e.el.style.pointerEvents='none'; continue; }
    const x=sx, y=rawY + Math.sin(t*.5+e.ph)*4;
    e.el.style.transform=`translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0) translate(-50%,-50%)`;
    e.el.style.opacity=(op*.96).toFixed(3);
    e.el.style.pointerEvents = (op>.3 && !state.locked && state.landed)?'auto':'none';
  }
  for(const er of state.eras){
    projV.copy(er.anchor).project(camera);
    const d=er.anchor.z - state.camZ;
    const sx=(projV.x*.5+.5)*w, rawY=(-projV.y*.5+.5)*h;
    let op=fadeOp(d);
    if(isWorld) op*=edgeOp(sx,rawY);
    if(op<0.01){ er.el.style.opacity='0'; continue; }
    er.el.style.transform=`translate3d(${sx.toFixed(1)}px,${rawY.toFixed(1)}px,0) translate(-50%,-50%)`;
    er.el.style.opacity=(op*.8).toFixed(3);
  }
  updateInkFocus(focusIdx, probes);
}
function smooth01(v){ return clamp(v,0,1); }

function inkGlowSprite(rgb){
  const c=document.createElement('canvas'); c.width=c.height=32;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(16,16,0,16,16,16);
  g.addColorStop(0,`rgba(${rgb},1)`);
  g.addColorStop(.22,`rgba(${rgb},.72)`);
  g.addColorStop(.58,`rgba(${rgb},.16)`);
  g.addColorStop(1,`rgba(${rgb},0)`);
  x.fillStyle=g; x.fillRect(0,0,32,32);
  return c;
}
const inkSprites=[inkGlowSprite('246,242,230'), inkGlowSprite('216,201,163'), inkGlowSprite('190,205,230')];

function addPolyline(out, coords, count, r, jitter=.008){
  const lens=[0];
  let total=0;
  for(let i=1;i<coords.length;i++){
    total += Math.hypot(coords[i][0]-coords[i-1][0], coords[i][1]-coords[i-1][1]);
    lens.push(total);
  }
  if(total<=0) return;
  let seg=1;
  for(let i=0;i<count;i++){
    const d=(i+.5)/count*total;
    while(seg<lens.length-1 && lens[seg]<d) seg++;
    const p0=coords[seg-1], p1=coords[seg];
    const u=(d-lens[seg-1])/Math.max(1e-6,lens[seg]-lens[seg-1]);
    out.push({
      x:lerp(p0[0],p1[0],u)+(r()-.5)*jitter,
      y:lerp(p0[1],p1[1],u)+(r()-.5)*jitter,
    });
  }
}
function addBezier(out, p0,p1,p2,p3, count, r, jitter=.01){
  for(let i=0;i<count;i++){
    const u=(i+.5)/count, v=1-u;
    out.push({
      x:v*v*v*p0[0]+3*v*v*u*p1[0]+3*v*u*u*p2[0]+u*u*u*p3[0]+(r()-.5)*jitter,
      y:v*v*v*p0[1]+3*v*v*u*p1[1]+3*v*u*u*p2[1]+u*u*u*p3[1]+(r()-.5)*jitter,
    });
  }
}
function addArc(out, cx,cy,rx,ry, a0,a1, count, r, jitter=.008){
  for(let i=0;i<count;i++){
    const u=i/(count-1), a=lerp(a0,a1,u);
    out.push({x:cx+Math.cos(a)*rx+(r()-.5)*jitter, y:cy+Math.sin(a)*ry+(r()-.5)*jitter});
  }
}
function addRidge(out, count, base, amp, r, phase=0, jitter=.012){
  for(let i=0;i<count;i++){
    const u=i/(count-1), x=-1+2*u;
    const y=base - amp*(.48+.52*Math.sin(u*Math.PI*2.1+phase)) - amp*.22*Math.sin(u*Math.PI*6.3+phase*1.7);
    out.push({x:x+(r()-.5)*jitter, y:y+(r()-.5)*jitter});
  }
}
function addWave(out, count, y, amp, r, phase=0){
  for(let i=0;i<count;i++){
    const u=i/(count-1), x=-1+2*u;
    out.push({x, y:y+Math.sin(u*Math.PI*4+phase)*amp+(r()-.5)*.008});
  }
}

/* 每个专题三种意象；每次成形递增 shapeIdx，避免“同一张图在同一处反复出现” */
function buildInkShape(sceneName, idx){
  const r=rng(9100+idx*137);
  const v=idx%3, pts=[];
  if(sceneName==='desert'){
    if(v===0){ // 孤烟、远山、归雁
      addRidge(pts, 128, .38, .22, r, .4);
      addRidge(pts, 104, .56, .13, r, 2.1);
      addBezier(pts, [-.18,.46],[-.28,.12],[-.03,-.16],[-.10,-.78], 112, r, .014);
      addBezier(pts, [.28,-.30],[.40,-.42],[.52,-.42],[.64,-.30], 34, r, .012);
      addBezier(pts, [.42,-.30],[.50,-.23],[.58,-.23],[.66,-.30], 30, r, .012);
    }else if(v===1){ // 烽火台与边关城堞
      addRidge(pts, 118, .52, .20, r, 1.2);
      addPolyline(pts, [[-.42,.56],[-.42,-.10],[-.20,-.10],[-.20,.56],[-.42,.56]], 94, r, .01);
      addPolyline(pts, [[-.48,-.10],[-.48,-.24],[-.38,-.24],[-.38,-.10],[-.30,-.10],[-.30,-.24],[-.20,-.24],[-.20,-.10],[-.12,-.10],[-.12,-.24],[-.04,-.24],[-.04,-.10]], 108, r, .008);
      addBezier(pts, [.10,.48],[.28,.18],[.18,-.20],[.36,-.64], 96, r, .014);
      addBezier(pts, [.48,-.30],[.58,-.39],[.68,-.39],[.78,-.30], 38, r, .012);
    }else{ // 长河落日路、沙丘与星
      addBezier(pts, [-1,.40],[-.56,.18],[-.12,.62],[1,.30], 118, r, .012);
      addBezier(pts, [-1,.62],[-.45,.44],[.20,.82],[1,.54], 118, r, .012);
      addBezier(pts, [-.72,.70],[-.20,.48],[.18,.40],[.70,.68], 94, r, .012);
      addArc(pts, .42,-.28,.20,.20, Math.PI*.18, Math.PI*1.55, 70, r, .008);
      for(let k=0;k<36;k++) pts.push({x:-.15+(r()-.5)*.18, y:-.52+(r()-.5)*.12});
    }
  }else if(sceneName==='sea'){
    if(v===0){ // 海上生明月：潮汐、倒影、小舟
      addPolyline(pts, [[-1,-.34],[1,-.34]], 86, r, .006);
      for(let k=0;k<4;k++) addWave(pts, 82, .04+k*.17, .035+.008*(k%2), r, k*.8);
      for(let k=0;k<7;k++){
        const yy=-.22+k*.105;

function makeInkParticle(x,y){

function adoptInkTargets(){

  const firstGather = ink.particles.length===0;
  const b = ink.backdrop || {cx:ink.w*.7,cy:ink.h*.62,rx:260,ry:180};
  while(ink.particles.length<pts.length){
    ink.particles.push(makeInkParticle(
      b.cx+(Math.random()-.5)*b.rx*(firstGather?1.35:.55),
      b.cy+(Math.random()-.5)*b.ry*(firstGather?1.35:.55)

  }
  if(ink.particles.length>pts.length) ink.particles.length=pts.length;
  for(let i=0;i<pts.length;i++){
    const p=ink.particles[i];
    p.tx=pts[i].x; p.ty=pts[i].y;
    p.delay=.04+Math.random()*.68;
    p.threshold=Math.random();

function scoreInkSlots(probes){
  const spotLeft = spotEl.classList.contains('show') || performance.now()-spotLastShown<500;
  return INK_SLOTS.map((s)=>{
    const cx=s.x*ink.w, cy=s.y*ink.h, rx=s.rx*ink.w, ry=s.ry*ink.h;
    let cur=0, future=0;
    for(const p of probes||[]){
      const nx=(p.x-cx)/rx, ny=(p.y-cy)/ry;
      const g=Math.exp(-(nx*nx+ny*ny)*.68);
      if(g<.012) continue;
      if(p.op>.04) cur += p.op*g;
      if(p.d>18 && p.d<150) future += (1-p.d/150)*g*.9;

function pickInkSlot(metrics, avoid){

    if(i===ink.lastSlot && i!==avoid) score+=.16;

function startInkDissolve(nextSlot,nextShape){

  ink.pending=layoutInkPoints(buildInkShape(activeScene,nextShape), nextSlot);
  ink.nextBackdrop=ink.backdrop;      // 新衬底暂存，待旧粒子散尽后再切换
  ink.backdrop=oldBackdrop;           // 消散期间衬底与漂移中心仍留在旧留白处
  ink.mode='dissolve'; ink.timer=0;
  const b=oldBackdrop||{cx:ink.w/2,cy:ink.h/2};
  for(const p of ink.particles){
    const away=Math.atan2(p.y-b.cy,p.x-b.cx)+(Math.random()-.5)*1.15;
    const sp=16+Math.random()*58;
    p.driftX=Math.cos(away)*sp;
    p.driftY=Math.sin(away)*sp*.55-(16+Math.random()*30);

function clearInk(){

}
function updateInkFocus(idx, probes){

  if(!eligible){ if(ink.visible) clearInk(); return; }
  if(ink.scene!==activeScene){
    clearInk();
    ink.scene=activeScene;
    ink.shapeIdx=Math.max(0,idx);
  }
  const metrics=scoreInkSlots(probes);
  if(!ink.visible || !ink.particles.length || ink.slot<0){
    const slot=pickInkSlot(metrics,-1);
    ink.pendingSlot=slot;
    ink.pendingShape=ink.shapeIdx;
    ink.pending=layoutInkPoints(buildInkShape(activeScene, ink.shapeIdx), slot);
    ink.visible=true;
    inkCanvas.classList.add('on');
    adoptInkTargets();
    return;
  }
  if(ink.mode==='dissolve') return;
  const current=metrics[ink.slot];
  const threatened = current.future>.32 || current.cur>.58;
  if(threatened){
    const nextSlot=pickInkSlot(metrics, ink.slot);
    startInkDissolve(nextSlot, ink.shapeIdx+1);
    return;
  }
  // 长久未被文字惊扰时，也缓缓散作光点、在另一处留白聚成下一幅意象，
  // 避免同一幅插画久驻原地（聚散皆以回忆光点般的慢节奏进行）
  if(ink.mode==='gather' && ink.timer>28){

    startInkDissolve(nextSlot, ink.shapeIdx+1);
  }
}
function tickInk(dt,t){
  if(!ink.visible) return;
  const ctx=inkCtx;
  ctx.clearRect(0,0,ink.w,ink.h);
  let dissolveP=0;
  if(ink.mode==='dissolve'){
    ink.timer+=dt;
    dissolveP=clamp(ink.timer/ink.dissolveDur,0,1);
    if(ink.timer>=ink.dissolveDur) adoptInkTargets();
  }else if(ink.mode==='gather'){
    ink.timer+=dt;
  }
  ctx.save();
  if(ink.backdrop){
    const b=ink.backdrop;
    const backA = ink.mode==='dissolve' ? .20*(1-dissolveP) : .20*smooth01(ink.timer/1.2);
    const g=ctx.createRadialGradient(b.cx,b.cy,0,b.cx,b.cy,Math.max(b.rx,b.ry));
    g.addColorStop(0,`rgba(2,4,10,${backA})`);
    g.addColorStop(.62,`rgba(2,4,10,${backA*.45})`);
    g.addColorStop(1,'rgba(2,4,10,0)');
    ctx.fillStyle=g;
    ctx.fillRect(b.cx-b.rx,b.cy-b.ry,b.rx*2,b.ry*2);
  }
  ctx.globalCompositeOperation='lighter';
  for(const p of ink.particles){
    if(p.delay>0){ p.delay-=dt; continue; }
    const ox=p.x, oy=p.y;
    if(ink.mode==='gather'){
      p.vx += (p.tx-p.x)*18*dt;
      p.vy += (p.ty-p.y)*18*dt;
      const damp=Math.pow(.82,dt*60);
      p.vx*=damp; p.vy*=damp;
      p.x += p.vx*dt + Math.sin(t*1.1+p.tw)*.10;
      p.y += p.vy*dt + Math.cos(t*.9+p.tw)*.08;
      const appear=smooth01((ink.timer-p.threshold*.55)/1.15);
      const targetA=p.baseA*appear*(.68+.32*Math.sin(t*1.8+p.tw));
      p.a=lerp(p.a,targetA,Math.min(1,dt*3.1));
    }else{
      const local=smooth01((dissolveP*1.28-p.threshold*.38-p.fadeDelay)/.72);
      p.vx=lerp(p.vx,p.driftX,Math.min(1,dt*1.7));
      p.vy=lerp(p.vy,p.driftY,Math.min(1,dt*1.7));
      p.x += (p.vx+Math.sin(t*.8+p.tw)*10)*dt*local;
      p.y += (p.vy+Math.cos(t*.7+p.tw)*7)*dt*local;
      const targetA=p.baseA*Math.pow(1-local,1.55)*(.58+.42*Math.sin(t*2.0+p.tw));
      p.a=lerp(p.a,targetA,Math.min(1,dt*4.4));

        ctx.globalCompositeOperation='lighter';
        ctx.globalAlpha=clamp(p.a*.18,0,1);
        ctx.strokeStyle='rgba(246,242,230,.55)';
        ctx.lineWidth=.7;
        ctx.beginPath();
        ctx.moveTo(ox-p.vx*.055,oy-p.vy*.055);
        ctx.lineTo(p.x,p.y);
        ctx.stroke();
      }
    }
    if(p.a<.01) continue;
    const s=p.sz*(1+.16*Math.sin(t*2.1+p.tw));
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=clamp(p.a*.58,0,1);
    ctx.fillStyle='#02040a';
    ctx.fillRect(p.x-1.05,p.y-1.05,2.1,2.1);
    ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=clamp(p.a,0,1);
    ctx.drawImage(p.sprite, p.x-s/2, p.y-s/2, s, s);
  }
  ctx.restore();
  ctx.globalAlpha=1;
}

const LUNAR_DATES=['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十',
  '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十',
  '廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
function lunarDayFromTheta(th){ // θ≥0 渐盈（右亮），θ<0 渐亏（左亮）

function lunarPhaseName(day){
  if(day<=1) return '新月 · 朔';

  if(day<=8) return '上弦月';
  if(day<=13) return '盈凸月';
  if(day<=16) return '满月 · 望';
  if(day<=21) return '亏凸月';
  if(day<=24) return '下弦月';

}
const lunarLabel=document.getElementById('lunarLabel');

  const cx=(c.x+1)/2*innerWidth, cy=(-c.y+1)/2*innerHeight;

function updateMoonShadow(px,py){ // 指针/手指拂过月面 → 阴影与农历标签跟随
  const {cx,cy,R}=moonScreen();

  if(landing.phase!=='idle'){ moonHoverT=0; renderer.domElement.style.cursor=''; return; }
  moonHoverT = moonHit(ev)?1:0;
  renderer.domElement.style.cursor = moonHoverT? 'pointer':'';
});
renderer.domElement.addEventListener('click', ev=>{
  if(landing.phase!=='idle') return;
  if(ev.pointerType && ev.pointerType!=='mouse') return; // 触摸轻点已在 pointerup 判定
  if(performance.now()-lastTouchMoonEnd<800) return;     // 抚月/触摸刚结束的合成 click 不再重复触发
  if(moonHit(ev)) startLanding();
});
function startLanding(){
  landing.phase='anim';
  landing.start=performance.now();
  renderer.domElement.style.cursor='';
  moonHoverT=0;
  shadowMode=false; lunarLabel.classList.remove('show');
}
function finishLanding(){
  landing.phase='done';
  state.landed=true;
  // 顶部 pill、chips、漂浮条目错峰 300ms 淡入
  const seq=[modeEl, chipsEl, entriesEl];
  seq.forEach((el,i)=>{ el.style.transitionDelay=(i*300)+'ms'; });
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.body.classList.remove('landing');
    setTimeout(()=>seq.forEach(el=>{ el.style.transitionDelay=''; }), 1600);
  }));
  hintEl.textContent='滚动 · 溯游时间长河';
  hintDone=false; hintEl.classList.remove('gone');
  // 进入时不自动放大任何一句：聚光只在用户点选文字时出现
  // 首次进入：等界面淡入之后，再浮出「溯游指南」
  if(!gdSeen()) setTimeout(()=>{ if(state.landed && !state.locked) gdOpen(); }, 1700);
}

/* 月之声：无歌词月夜环境音（随机选一段循环，可换可关；默认关闭） */
const AU_TRACKS=[
  {f:'moon-amb-1.mp3', n:'流光'},
  {f:'moon-amb-2.mp3', n:'风铃'},
  {f:'moon-amb-3.mp3', n:'深空'},
];
const auWrap=document.getElementById('moonAudio'), auToggleBtn=document.getElementById('auToggle'),
      auNextBtn=document.getElementById('auNext'), auLabelEl=document.getElementById('auLabel');
const bgm=new Audio(); bgm.volume=.38; bgm.preload='none'; bgm.loop=true;
let auOn=false, auWant=false, auIdx=-1, auAvail=true;
function auFail(){
  // 资源加载失败（如离线包未含音频文件）：还原 UI，避免"显示正在播放却无声"
  auAvail=false; auOn=false; auWant=false;
  auWrap.classList.remove('on');
  try{ bgm.pause(); }catch(e){}
  auLabelEl.textContent='音频未随包提供';
}
// 仅在媒体资源真正加载失败时触发（文件存在时不会触发，线上站不受影响）
bgm.addEventListener('error', auFail);
function auPlay(i){
  if(!auAvail) return;
  auIdx=i; const tr=AU_TRACKS[i];
  bgm.src='audio/'+tr.f;
  bgm.play().catch(()=>{});
  auLabelEl.textContent='正在听 · '+tr.n;
}
function auStart(){ if(!auAvail) return; auOn=true; auWrap.classList.add('on'); auPlay(Math.floor(Math.random()*AU_TRACKS.length)); }
function auStop(){
  auOn=false; auWrap.classList.remove('on');
  bgm.pause();
  auLabelEl.textContent='听听月亮的声音';
}
auToggleBtn.addEventListener('click', ev=>{
  ev.stopPropagation();
  if(!auAvail) return;
  auWant=!auWant;
  if(auWant) auStart(); else auStop();
});
auNextBtn.addEventListener('click', ev=>{
  ev.stopPropagation();
  if(!auAvail) return;
  if(!auOn){ auWant=true; auStart(); return; }
  auPlay((auIdx+1)%AU_TRACKS.length);
});

/* ---------------- 模式 / 专题切换（黑场 + 锁定） ---------------- */
function transitionTo(fn){
  if(state.locked) return;
  state.locked=true;
  document.body.classList.add('locked');
  veilEl.classList.add('on');
  setTimeout(()=>{
    fn();
    requestAnimationFrame(()=>{
      veilEl.classList.remove('on');
      setTimeout(()=>{ state.locked=false; document.body.classList.remove('locked'); },200);
    });
  },620);
}
modeEl.querySelectorAll('button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    if(state.mode===btn.dataset.mode||state.locked) return;
    modeEl.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===btn));
    state.mode=btn.dataset.mode;
    document.body.dataset.mode=state.mode;
    transitionTo(()=>{
      chipsEl.classList.toggle('hidden', state.mode!=='poem');
      if(state.mode!=='poem'){ state.theme='全部'; syncChips(); switchScene('cosmos'); }
      else switchScene(THEME_SCENE[state.theme]);
      buildFlow();
      // 切换页面不自动选中/放大第一句，等用户点击才算数
      state.selected=-1; hideSpot();
      if(state.mode==='world'){
        // 进入世界版：月亮保持/归回满月（θ=0），浮现开场引言
        animatePhaseTo(0);
        showWorldIntro();
      }
    });
  });
});
const CHIP_NAMES=['全部','李白的月亮','苏轼的月亮','中秋的月亮','边关的月亮'];
CHIP_NAMES.forEach(name=>{
  const b=document.createElement('button');
  b.textContent=name; b.dataset.theme=name;
  if(name==='全部') b.classList.add('on');
  b.addEventListener('click',()=>{
    if(state.theme===name||state.locked||state.mode!=='poem'||!state.landed) return;
    state.theme=name; syncChips();
    transitionTo(()=>{
      switchScene(THEME_SCENE[name]);
      buildFlow();
      state.selected=-1; hideSpot();   // 换专题同样不自动放大第一句
    });
  });
  chipsEl.appendChild(b);
});
function syncChips(){
  chipsEl.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.theme===state.theme));
}
/* ---------------- 相机 & 月球布局 & 主循环 ---------------- */
const cam = { z:0, x:0, y:6 };
let moonFrac = .30, moonFracTarget = .30;
let moonSizeFrac = .21, moonSizeTarget = .21, moonFlat = 0, moonBaseBump = 3.0;
function layout(){
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', ()=>{
  renderer.setSize(innerWidth, innerHeight);
  layout();
  tsBuild();
});
layout();

const clock = new THREE.Clock();
function frame(){
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), .05);
  const t = clock.elapsedTime;
  const now = performance.now();

  // 相机沿时间轴推进（阻尼 lerp）
  state.camZ = lerp(state.camZ, state.camTargetZ, .06);
  cam.z = state.camZ;
  camera.position.set(cam.x, cam.y, cam.z);
  camera.lookAt(cam.x, cam.y+2, cam.z-100);
  tsSync();

  // 着陆动画进度（2.4s 慢启动慢收尾）
  if(landing.phase==='anim'){
    landing.u = smootherstep((now - landing.start)/2400);
    if(landing.u>=1){ landing.u=1; finishLanding(); }
  }
  moonHover = lerp(moonHover, moonHoverT, Math.min(1, dt*7));

  // 月球布局：远处一轮月，偏上微右；随时间轴进度 p 从 100% 微微变近到 87%
  moonFracTarget = SCENE_CFG[activeScene].moonY;
  moonFrac = lerp(moonFrac, moonFracTarget, Math.min(1,dt*1.2));
  moonSizeTarget = SCENE_CFG[activeScene].moonSize;
  moonSizeFrac = lerp(moonSizeFrac, moonSizeTarget, Math.min(1,dt*1.2));
  // 专题场景：月亮更远更高，光照压平 → 水墨工笔的平面月
  const flatTarget = SCENE_CFG[activeScene].moonFlat ? 1 : 0;
  moonFlat = lerp(moonFlat, flatTarget, Math.min(1,dt*1.6));
  sun.intensity = 2.5 * lerp(1, 0.40, moonFlat);
  moonMat.emissiveIntensity = 0.0825 * lerp(1, 3.6, moonFlat);
  moonMat.bumpScale = moonBaseBump * lerp(1, 0.35, moonFlat);
  const pApproach = state.maxZ>0 ? clamp(state.camZ/state.maxZ, 0, 1) : 0;
  const dist = 170 * (1 - 0.13*pApproach);
  const halfH = Math.tan(camera.fov*Math.PI/360)*dist;
  const halfW = halfH*camera.aspect;
  // 尺寸按基准距离 170 计算，不随变近补偿 → 整段旅程视觉直径增大约 15%
  const refHalfH = Math.tan(camera.fov*Math.PI/360)*170;
  const moonXTarget = SCENE_CFG[activeScene].moonX ?? .24;
  let sizeFrac = moonSizeFrac, xFrac = moonXTarget, yFrac = (1-2*moonFrac)*.9;
  if(landing.phase!=='done'){ // 着陆：巨大月亮特写 → 飞远缩小到交互布局
    const u = landing.u;
    sizeFrac = lerp(.70, moonSizeFrac, u);
    xFrac = lerp(0, moonXTarget, u);
    yFrac = lerp(.03, (1-2*moonFrac)*.9, u);
  }
  moonGroup.position.set(
    cam.x + halfW*xFrac,
    cam.y + halfH*yFrac,
    cam.z - dist
  );
  const maxFracByW = 0.88*halfW/refHalfH;  // 窄屏（竖屏手机）按宽度收束，月亮不溢出画面
  const wantH = Math.min(sizeFrac, maxFracByW)*2*refHalfH;
  const s = wantH/(2*MOON_R);
  moonGroup.scale.setScalar(s);
  // 极慢自转
  moon.rotation.y += dt*0.01;

  // 月相
  if(shadowMode){ // 着陆页：阴影跟随指针拂过月面
    phase.theta = lerp(phase.theta, shadowThetaT, Math.min(1, dt*14));
  }else if(landing.phase!=='done' && Math.abs(phase.theta)>0.01){ // 离开月面/起飞 → 柔回满月
    phase.theta = lerp(phase.theta, 0, Math.min(1, dt*3));
  }
  tickCursor(dt);
  tickPhase(now);
  litRatio = applySun();
  // 着陆页 hover：光晕微微增强
  if(moonHover>0.001) glowMat.opacity = Math.min(1, glowMat.opacity*(1+moonHover*.35));

  // 星河
  starUniforms.uTime.value = t;
  starGroup.position.z = cam.z*(0.55 + 0.45*Math.min(1,Math.max(0,(cam.z-800)/1600))); // 近处视差，深处渐变为跟随相机，星壳不再落到身后
  starGroup.rotation.z = t*0.002;          // 极慢微旋转
  starGroup.position.y = Math.sin(t*.05)*2;
  // 银河雾带极慢漂移
  for(let i=0;i<milkySprites.length;i++){
    const sp=milkySprites[i];
    sp.position.x = sp.userData.x0 + Math.cos(t*0.007+sp.userData.ph)*10;
    sp.position.y = sp.userData.y0 + Math.sin(t*0.010+sp.userData.ph)*6;
  }

  tickMeteors(dt, now);
  tickDesert(t);
  tickSushi(t);
  tickFog(dt);
  tickInk(dt,t);

  // 水面 uniform
  seaUniforms.uTime.value=t;
  seaUniforms.uMoonX.value=moonGroup.position.x;
  seaUniforms.uLit.value=litRatio;
  seaUniforms.uFogColor.value.copy(scene.fog.color);
  riverUniforms.uTime.value=t;
  riverUniforms.uMoonX.value=moonGroup.position.x;
  riverUniforms.uLit.value=litRatio;
  riverUniforms.uFogColor.value.copy(scene.fog.color);

  projectEntries(t);
  renderer.render(scene, camera);
}

/* ---------------- 新手教学：溯游指南 ----------------
   进入后自动浮现一次，先讲清楚能做什么；可跳过，也可点右上角「？」再看。
   不打断浏览：滚轮 / 轻扫照常生效，点到高亮的那个目标也不拦，只有点空处才收起。 */
const guideEl=document.getElementById('guide'), gdRing=document.getElementById('gdRing'),
      gdCard=document.getElementById('gdCard'), gdTitle=document.getElementById('gdTitle'),
      gdBody=document.getElementById('gdBody'), gdDots=document.getElementById('gdDots'),
      gdBar=document.getElementById('gdBar'), gdPrev=document.getElementById('gdPrev'),
      gdNext=document.getElementById('gdNext'), gdSkip=document.getElementById('gdSkip'),
      guideBtn=document.getElementById('guideBtn');
const GUIDE_KEY='moon.guide.seen.v1';
const GUIDE_STEPS=[
  {t:'滚动 · 顺流而下', b:'向下滚动，就顺着时间长河漂下去——一句句诗与歌自会迎上来。向上回溯，向下向今。', cut:'view'},
  {t:'拖着时间轴 · 一跃千年', b:'按住画面底部的时间轴左右拖动，或直接点击时间轴上的某一点，可以飞快跳到某个年代；圆点上方的年份，就是此刻所在的年代。', cut:'timeline'},
  {t:'轻点一句 · 聚光成笺', b:'点一下任意一句诗或歌词，它会浮到月光里被照亮；双击，则直接收进拾月集。', cut:'entry'},
  // 沉浸态（进入时间长河之后）里，月相由「点了哪一句」决定，而不是抚过月面——
  // 抚月变幻是着陆页的手势，进来之后就不再生效。高亮仍落在月亮上：变化就发生在那里；
  // 用户照做去点诗句时，点击由下方 onInteractive 放行，不会把指南误收起。
  {t:'随句盈亏 · 变幻月相', b:'在「长河」模式下，点一下诗句或歌词，月相会随文字的语义内容变化。', cut:'moon'},
  {t:'拾月集 · 收拢一笺清辉', b:'喜欢的句子收进右下角的「拾月集」，可以按住手柄上下排序，也能导出成文字或图片带走。', cut:'notebook'},
];
let gdIdx=0, gdRAF=0, gdTargetEl=null;
function gdSeen(){ try{ return localStorage.getItem(GUIDE_KEY)==='1'; }catch(e){ return false; } }
function gdMark(){ try{ localStorage.setItem(GUIDE_KEY,'1'); }catch(e){} }
function gdPickEntry(){   // 取屏上最靠中心、且已经显影的那一句
  const list=entriesEl.querySelectorAll('.entry');
  const cx=innerWidth/2, cy=innerHeight/2;
  let best=null, bd=1e9;
  list.forEach(el=>{
    if(parseFloat(el.style.opacity||'1')<0.25) return;
    const r=el.getBoundingClientRect();
    if(r.right<80||r.left>innerWidth-80||r.bottom<100||r.top>innerHeight-100) return;
    const d=Math.hypot(r.left+r.width/2-cx, r.top+r.height/2-cy);
    if(d<bd){ bd=d; best=el; }
  });
  return best;
}
function gdWrap(el){      // 贴合文字的实际外框（子元素并集），比整块盒子更准
  const kids=[...el.children];
  if(!kids.length) return el.getBoundingClientRect();
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  kids.forEach(k=>{
    const r=k.getBoundingClientRect();
    if(!r.width && !r.height) return;
    x0=Math.min(x0,r.left); y0=Math.min(y0,r.top);
    x1=Math.max(x1,r.right); y1=Math.max(y1,r.bottom);
  });
  return x0>1e8? el.getBoundingClientRect() : {left:x0, top:y0, right:x1, bottom:y1, width:x1-x0, height:y1-y0};
}
function gdPlace(){
  const s=GUIDE_STEPS[gdIdx];
  let r=null;
  if(s.cut==='timeline'){
    const b=tscrubEl.getBoundingClientRect();
    r={x:b.left+8, y:b.top-4, w:b.width-16, h:b.height+8};
  }else if(s.cut==='entry'){
    if(gdTargetEl){ const b=gdWrap(gdTargetEl);
      r={x:b.left-20, y:b.top-16, w:b.width+40, h:b.height+32}; }
  }else if(s.cut==='moon'){
    const m=moonScreen(), w=m.R*2.5;
    r={x:m.cx-w/2, y:m.cy-w/2, w:w, h:w};
  }else if(s.cut==='notebook'){
    const b=document.getElementById('notebookBtn').getBoundingClientRect();
    r={x:b.left-12, y:b.top-10, w:b.width+24, h:b.height+20};
  }
  if(!r){ gdRing.classList.remove('on'); guideEl.dataset.cut='0'; return; }
  gdRing.style.left=r.x+'px'; gdRing.style.top=r.y+'px';
  gdRing.style.width=r.w+'px'; gdRing.style.height=r.h+'px';
  gdRing.classList.add('on'); guideEl.dataset.cut='1';
}
function gdLoop(){
  if(!guideEl.classList.contains('on')){ gdRAF=0; return; }
  gdPlace();
  gdRAF=requestAnimationFrame(gdLoop);
}
function gdShow(i){
  gdIdx=Math.max(0, Math.min(GUIDE_STEPS.length-1, i));
  const s=GUIDE_STEPS[gdIdx];
  gdTitle.textContent=s.t; gdBody.textContent=s.b;
  [...gdDots.children].forEach((d,k)=>d.classList.toggle('on', k<=gdIdx));
  gdBar.style.width=((gdIdx+1)/GUIDE_STEPS.length*100)+'%';
  gdPrev.disabled = gdIdx===0;
  gdNext.textContent = gdIdx===GUIDE_STEPS.length-1 ? '开始溯游' : '下一步';
  gdTargetEl = s.cut==='entry' ? gdPickEntry() : null;
  gdPlace();
}
function gdOpen(){
  if(!state.landed) return;
  if(!gdDots.children.length) GUIDE_STEPS.forEach(()=>gdDots.appendChild(document.createElement('i')));
  guideEl.classList.add('on');
  gdShow(0);
  if(!gdRAF) gdRAF=requestAnimationFrame(gdLoop);
}
function gdClose(){
  if(!guideEl.classList.contains('on')) return;
  gdMark();
  guideEl.classList.remove('on');
  gdRing.classList.remove('on');
  if(gdRAF){ cancelAnimationFrame(gdRAF); gdRAF=0; }
}
gdNext.addEventListener('click',()=>{ gdIdx>=GUIDE_STEPS.length-1 ? gdClose() : gdShow(gdIdx+1); });
gdPrev.addEventListener('click',()=>gdShow(gdIdx-1));
gdSkip.addEventListener('click',gdClose);
guideBtn.addEventListener('click',gdOpen);
addEventListener('keydown',ev=>{ if(ev.key==='Escape') gdClose(); });
document.addEventListener('click',ev=>{
  if(!guideEl.classList.contains('on')) return;
  if(ev.target.closest('#gdCard')) return;
  // 点在挖出的高亮区里 → 让它照常生效（比如真的点中一句、真的拖时间轴），不收起指南
  const r=gdRing.getBoundingClientRect();
  const onTarget = gdRing.classList.contains('on') &&
    ev.clientX>=r.left && ev.clientX<=r.right && ev.clientY>=r.top && ev.clientY<=r.bottom;
  // 点在诗句/歌词、顶部标签、模式按钮这类可交互目标上 → 也不收起：
  // 第 4 步本就要用户「点一句诗看月相」，若此时把指南关掉，等于教到一半就散了。
  const onInteractive = !!ev.target.closest('.entry,.chip,button');
  if(!onTarget && !onInteractive) gdClose();
},true);

/* ---------------- 启动 ---------------- */
buildFlow();
frame();
</script>
